<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PHONIX — السلة</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="brand">
      <img src="LOGOPHONE.png" alt="PHONIX Logo" class="logo" />
      <div>
        <h1>PHONIX</h1>
        <p class="subtitle">سلة المشتريات</p>
      </div>
    </div>
  
    <button class="hamburger" onclick="document.querySelector('.nav-links').classList.toggle('show')">
      ☰
    </button>
  
    <nav class="nav-links">
      <a href="index.html" class="nav-link">الرئيسية</a>
      <a href="products.html" class="nav-link">المنتجات</a>
      <a href="repair.html" class="nav-link">طلب صيانة</a>
      <a href="admin.html" class="nav-link" id="admin-link" style="display:none;">لوحة التحكم</a>
      <a href="cart.html" class="nav-link active cart-link">سلة (<span id="cart-count-header">0</span>)</a>
      <a href="#" onclick="logout()" class="nav-link" style="color: var(--danger)">تسجيل خروج</a>
    </nav>
  </header>

  <main class="container">
    <section class="section card">
      <h3>سلة مشترياتك</h3>
      <div id="cart-items-page" class="cart-items"></div>

      <div class="cart-footer page">
        <div class="total">الإجمالي: <span id="cart-total-page">0</span> ج</div>
        <div class="cart-actions">
          <button id="clear-cart-page" class="btn ghost">تفريغ السلة</button>
          <button id="checkout-page" class="btn">إتمام الطلب</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© PHONIX Store</p>
  </footer>

  <!-- Firebase SDKs & Auth -->
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <script src="auth.js"></script>

  <script src="products-data.js"></script>
  <script src="script.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      checkAuthState(async (user, role) => {
        const adminLink = document.getElementById('admin-link');
        if (adminLink) adminLink.style.display = (role === 'admin') ? 'inline-block' : 'none';
        await initializeData();
        initCartPage();
        updateCartCountHeader();
  
        // إغلاق قائمة الهامبرغر عند اختيار رابط
        document.querySelectorAll('.nav-links .nav-link').forEach(link => {
          link.addEventListener('click', () => {
            document.querySelector('.nav-links').classList.remove('show');
          });
        });
      });
    });
  </script>
</body>
</html>
