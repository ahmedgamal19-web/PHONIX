<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PHONIX — طلب صيانة</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="brand">
      <img src="LOGOPHONE.png" alt="PHONIX Logo" class="logo" />
      <div>
        <h1>PHONIX</h1>
        <p class="subtitle">طلب صيانة سريع</p>
      </div>
    </div>
  
    <button class="hamburger" onclick="document.querySelector('.nav-links').classList.toggle('show')">
      ☰
    </button>
  
    <nav class="nav-links">
      <a href="index.html" class="nav-link">الرئيسية</a>
      <a href="products.html" class="nav-link">المنتجات</a>
      <a href="repair.html" class="nav-link active">طلب صيانة</a>
      <a href="admin.html" class="nav-link" id="admin-link" style="display:none;">لوحة التحكم</a>
      <a href="cart.html" class="nav-link cart-link">سلة (<span id="cart-count-header">0</span>)</a>
      <a href="#" onclick="logout()" class="nav-link" style="color: var(--danger)">تسجيل خروج</a>
    </nav>
  </header>

  <main class="container">
    <section class="section card">
      <h3>طلب خدمة صيانة</h3>
      <form id="repair-form-page" class="form">
        <div class="row"><label>الاسم</label><input name="name" required /></div>
        <div class="row"><label>الهاتف</label><input name="phone" required /></div>
        <div class="row"><label>نوع الجهاز</label><input name="device" placeholder="مثال: iPhone 12" /></div>
        <div class="row"><label>وصف المشكلة</label><textarea name="issue" rows="4" required></textarea></div>
        <div class="row actions">
          <button type="submit" class="btn">إرسال الطلب</button>
          <button type="reset" class="btn ghost">تفريغ</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>© PHONIX Store</p>
  </footer>

  <!-- Firebase SDKs & Auth -->
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <script src="auth.js"></script>

  <script src="products-data.js"></script>
  <script src="script.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      checkAuthState(async (user, role) => {
        const adminLink = document.getElementById('admin-link');
        if (adminLink) adminLink.style.display = (role === 'admin') ? 'inline-block' : 'none';
  
        await initializeData(); // تحميل المنتجات إن احتاجتها الصفحة (للتوحيد)
        initRepairPage();
        updateCartCountHeader();
  
        // إغلاق قائمة الهامبرغر عند اختيار رابط
        document.querySelectorAll('.nav-links .nav-link').forEach(link => {
          link.addEventListener('click', () => {
            document.querySelector('.nav-links').classList.remove('show');
          });
        });
      });
    });
  </script>
</body>
</html>
